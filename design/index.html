<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hello-word-14</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --text: #000000;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    main {
      text-align: center;
      font-size: clamp(2rem, 8vw, 5rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main aria-label="Hello Word">Hello Word</main>
</body>
</html>
